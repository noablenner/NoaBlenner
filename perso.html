<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrée perso 🔒</title>
<style>
  @font-face{ font-family:"Fredoka"; font-style:normal; font-weight:300 700; font-display:swap;
    src:url("assets/fonts/fredoka-latin.woff2") format("woff2"); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif; background:#0d1b2a; color:#eef4ff;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ width:100%; max-width:460px; background:#16233a; border:3px solid #3a4d6d; border-radius:20px;
    padding:30px 26px; box-shadow:0 14px 40px #0008; }
  h1{ font-size:1.7rem; margin-bottom:6px; }
  .muted{ color:#9fb3d1; font-size:.95rem; margin-bottom:20px; }
  label{ display:block; font-weight:600; margin-bottom:8px; }
  input[type=password]{ width:100%; font-family:inherit; font-size:1.1rem; padding:13px 15px;
    border-radius:12px; border:2px solid #3a4d6d; background:#0f1a2e; color:#fff; }
  input[type=password]:focus{ outline:none; border-color:#3ddc97; }
  button{ font-family:inherit; font-weight:700; font-size:1.1rem; cursor:pointer; }
  .go{ margin-top:14px; width:100%; padding:13px; border:none; border-radius:12px;
    background:#3ddc97; color:#08251a; }
  .go:active{ transform:translateY(2px); }
  .err{ color:#ff8091; margin-top:12px; min-height:20px; font-weight:600; }
  .back{ display:inline-block; margin-top:18px; color:#9fb3d1; text-decoration:none; font-size:.9rem; }
  .hidden{ display:none; }
  /* zone révélée */
  .block-title{ font-size:1.1rem; font-weight:700; margin:22px 0 10px; color:#cfe0ff; }
  .row{ display:flex; align-items:center; gap:10px; background:#0f1a2e; border:2px solid #3a4d6d;
    border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .row > .cell{ flex:1; min-width:0; }
  .val{ font-family:"Trebuchet MS",monospace; font-size:1.05rem; word-break:break-all; user-select:all; display:block; }
  a.val{ color:#7cc3ff; }
  .copy{ background:#2a9d8f; color:#fff; border:none; border-radius:9px; padding:8px 12px; font-size:.9rem; flex:none; }
  .copy:active{ transform:translateY(2px); }
  .lbl{ font-size:.8rem; color:#9fb3d1; display:block; margin-bottom:3px; }
  .warn{ font-size:.8rem; color:#c7b26b; margin-top:16px; line-height:1.4; }
</style>
</head>
<body>
  <div class="card">
    <!-- Étape mot de passe -->
    <div id="gate">
      <h1>🔒 Entrée perso</h1>
      <p class="muted">Accès protégé. Entre le mot de passe.</p>
      <label for="pw">Mot de passe</label>
      <input type="password" id="pw" autocomplete="off" autofocus placeholder="••••••••">
      <button class="go" id="go">Déverrouiller</button>
      <p class="err" id="err"></p>
      <a class="back" href="index.html">← retour au site</a>
    </div>

    <!-- Étape contenu révélé (construit dynamiquement) -->
    <div id="content" class="hidden">
      <h1>✅ Accès autorisé</h1>
      <p class="muted">Voilà ce que tu cherchais.</p>
      <div id="blocks"></div>
      <p class="warn">⚠️ Page protégée côté navigateur uniquement. Ne partage pas le mot de passe.</p>
      <a class="back" href="index.html">← retour au site</a>
    </div>
  </div>

<script>
// Contenu chiffré (AES-256-GCM, clé dérivée par PBKDF2 depuis le mot de passe).
// Le texte en clair n'existe nulle part dans ce fichier.
const BLOB = {"iter":250000,"salt":"2wG87nxAk6MsyErcZ74mrw==","iv":"ZAB57G8X3S9NvTzt","data":"rqJjf5Ewm15se423sLypcHOxM5nGKbNzR+zvQ/M2iBnYnzkzAwvFYtmGCHqZXKjA4rI0M+sOdCDAFyk/5qVl8mdUGV4sfXq9rEipkO4qg703MvAadIYnhRN+jqy6x3diof35CIyXFBIqy7frK0PXXYkusqyQtJe5f2XIvcd1Y8h/1COUyc4qUICXNXNbYmFdC59/Zo+tdKcu0DSA7oseuv6qwzeq+GvyrYT8"};

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pwInput = document.getElementById("pw");
const err = document.getElementById("err");

async function unlock(){
  err.textContent = "";
  const pw = pwInput.value;
  if(!pw){ err.textContent = "Entre le mot de passe."; return; }
  try{
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(BLOB.salt), iterations:BLOB.iter, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const ptBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(BLOB.iv) }, key, b64(BLOB.data));
    show(JSON.parse(new TextDecoder().decode(ptBuf)));
  }catch(e){
    err.textContent = "❌ Mauvais mot de passe.";
    pwInput.value = "";
    pwInput.focus();
  }
}

// crée une ligne (label + valeur + bouton copier). isLink -> rendu <a>
function makeRow(label, value, isLink){
  const row = document.createElement("div"); row.className = "row";
  const cell = document.createElement("div"); cell.className = "cell";
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = label;
  const val = document.createElement(isLink ? "a" : "span"); val.className = "val"; val.textContent = value;
  if(isLink){ val.href = value; val.target = "_blank"; val.rel = "noopener"; }
  cell.appendChild(lbl); cell.appendChild(val);
  const btn = document.createElement("button"); btn.className = "copy"; btn.textContent = "Copier";
  btn.addEventListener("click", () => {
    navigator.clipboard.writeText(value).then(() => {
      btn.textContent = "✓ Copié"; setTimeout(() => btn.textContent = "Copier", 1200);
    });
  });
  row.appendChild(cell); row.appendChild(btn);
  return row;
}

function addBlock(container, title, rows){
  const h = document.createElement("div"); h.className = "block-title"; h.textContent = title;
  container.appendChild(h);
  rows.forEach(r => container.appendChild(makeRow(r.label, r.value, r.isLink)));
}

function show(data){
  const blocks = document.getElementById("blocks");
  blocks.innerHTML = "";

  const tvRows = [];
  if(data.tradovate){
    if(data.tradovate.link) tvRows.push({ label:"Lien", value:data.tradovate.link, isLink:true });
    (data.tradovate.lines || []).forEach((v, i) => tvRows.push({ label:"Ligne " + (i+1), value:v }));
    addBlock(blocks, "🟢 Tradovate", tvRows);
  }

  if(data.prt){
    const prtRows = (data.prt.lines || []).map((v, i) => ({ label:"Ligne " + (i+1), value:v }));
    addBlock(blocks, "🔵 ProRealTime", prtRows);
  }

  document.getElementById("gate").classList.add("hidden");
  document.getElementById("content").classList.remove("hidden");
}

document.getElementById("go").addEventListener("click", unlock);
pwInput.addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
</script>
</body>
</html>
