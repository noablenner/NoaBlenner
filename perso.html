<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrée perso 🔒</title>
<style>
  @font-face{ font-family:"Fredoka"; font-style:normal; font-weight:300 700; font-display:swap;
    src:url("assets/fonts/fredoka-latin.woff2") format("woff2"); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif; background:#0d1b2a; color:#eef4ff;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ width:100%; max-width:460px; background:#16233a; border:3px solid #3a4d6d; border-radius:20px;
    padding:30px 26px; box-shadow:0 14px 40px #0008; }
  h1{ font-size:1.7rem; margin-bottom:6px; }
  .muted{ color:#9fb3d1; font-size:.95rem; margin-bottom:20px; }
  label{ display:block; font-weight:600; margin-bottom:8px; }
  input[type=password]{ width:100%; font-family:inherit; font-size:1.1rem; padding:13px 15px;
    border-radius:12px; border:2px solid #3a4d6d; background:#0f1a2e; color:#fff; }
  input[type=password]:focus{ outline:none; border-color:#3ddc97; }
  button{ font-family:inherit; font-weight:700; font-size:1.1rem; cursor:pointer; }
  .go{ margin-top:14px; width:100%; padding:13px; border:none; border-radius:12px;
    background:#3ddc97; color:#08251a; }
  .go:active{ transform:translateY(2px); }
  .err{ color:#ff8091; margin-top:12px; min-height:20px; font-weight:600; }
  .back{ display:inline-block; margin-top:18px; color:#9fb3d1; text-decoration:none; font-size:.9rem; }
  .hidden{ display:none; }
  /* zone révélée */
  .reveal .row{ display:flex; align-items:center; gap:10px; background:#0f1a2e; border:2px solid #3a4d6d;
    border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .reveal .val{ flex:1; font-family:"Trebuchet MS",monospace; font-size:1.05rem; word-break:break-all; user-select:all; }
  .reveal a.val{ color:#7cc3ff; }
  .copy{ background:#2a9d8f; color:#fff; border:none; border-radius:9px; padding:8px 12px; font-size:.9rem; }
  .copy:active{ transform:translateY(2px); }
  .lbl{ font-size:.8rem; color:#9fb3d1; display:block; margin-bottom:3px; }
  .warn{ font-size:.8rem; color:#c7b26b; margin-top:16px; line-height:1.4; }
</style>
</head>
<body>
  <div class="card">
    <!-- Étape mot de passe -->
    <div id="gate">
      <h1>🔒 Entrée perso</h1>
      <p class="muted">Accès protégé. Entre le mot de passe.</p>
      <label for="pw">Mot de passe</label>
      <input type="password" id="pw" autocomplete="off" autofocus placeholder="••••••••">
      <button class="go" id="go">Déverrouiller</button>
      <p class="err" id="err"></p>
      <a class="back" href="index.html">← retour au site</a>
    </div>

    <!-- Étape contenu révélé -->
    <div id="content" class="reveal hidden">
      <h1>✅ Accès autorisé</h1>
      <p class="muted">Voilà ce que tu cherchais.</p>

      <div class="row">
        <div style="flex:1">
          <span class="lbl">Lien</span>
          <a class="val" id="lnk" target="_blank" rel="noopener"></a>
        </div>
        <button class="copy" data-for="lnk">Copier</button>
      </div>

      <div class="row">
        <div style="flex:1">
          <span class="lbl">Ligne 1</span>
          <span class="val" id="l1"></span>
        </div>
        <button class="copy" data-for="l1">Copier</button>
      </div>

      <div class="row">
        <div style="flex:1">
          <span class="lbl">Ligne 2</span>
          <span class="val" id="l2"></span>
        </div>
        <button class="copy" data-for="l2">Copier</button>
      </div>

      <p class="warn">⚠️ Page protégée côté navigateur uniquement. Ne partage pas le mot de passe.</p>
      <a class="back" href="index.html">← retour au site</a>
    </div>
  </div>

<script>
// Contenu chiffré (AES-256-GCM, clé dérivée par PBKDF2 depuis le mot de passe).
// Le texte en clair n'existe nulle part dans ce fichier.
const BLOB = {"iter":250000,"salt":"C4wfbPIuzOxwxD4UoP/3vA==","iv":"+1p+nHak0DIjjC78","data":"CSMu1BgeiDYKUVMoypJdPVCDl7IDbUjUVC1BzKfkHtvwiTifNTaiQdot46p6VvJd129yBrtCzbKn2TSAdy1HPXdw5QYAZimtv2TTJwQuMhC/H8EMcSmaSlssSNu7+UHpFeK41kfTzUqY"};

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pwInput = document.getElementById("pw");
const err = document.getElementById("err");

async function unlock(){
  err.textContent = "";
  const pw = pwInput.value;
  if(!pw){ err.textContent = "Entre le mot de passe."; return; }
  try{
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(BLOB.salt), iterations:BLOB.iter, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const ptBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(BLOB.iv) }, key, b64(BLOB.data));
    const data = JSON.parse(new TextDecoder().decode(ptBuf));
    show(data);
  }catch(e){
    err.textContent = "❌ Mauvais mot de passe.";
    pwInput.value = "";
    pwInput.focus();
  }
}

function show(data){
  const lnk = document.getElementById("lnk");
  lnk.href = data.link; lnk.textContent = data.link;
  document.getElementById("l1").textContent = data.lines[0];
  document.getElementById("l2").textContent = data.lines[1];
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("content").classList.remove("hidden");
}

document.getElementById("go").addEventListener("click", unlock);
pwInput.addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });

document.querySelectorAll(".copy").forEach(btn => {
  btn.addEventListener("click", () => {
    const el = document.getElementById(btn.dataset.for);
    const txt = el.tagName === "A" ? el.href : el.textContent;
    navigator.clipboard.writeText(txt).then(() => {
      const old = btn.textContent; btn.textContent = "✓ Copié";
      setTimeout(() => btn.textContent = old, 1200);
    });
  });
});
</script>
</body>
</html>
